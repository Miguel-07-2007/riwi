<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas-Rueda-Libre</title>
</head>

<body>
    <header>
        <h1>Reserva tu bicicleta</h1>
         <nav>
            <ul>
                <li>
                    <a href="tarifas.html">Tarifas y Rutas</a>
                </li>
                <li>
                    <a href="../index.html">Inicio</a>
                </li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h2>Horario de Atención:</h2>
        <dl>
            <dt>Lunes a viernes</dt>
            <dd>7:00 a.m. - 7:00 p.m.</dd>
            <dt>Sábados, domingos y festivos</dt>
            <dd>6:00 a.m. - 2:00 p.m.</dd>
        </dl>
        </section>

        <section>
           <h2>Formulario de Reserva</h2>
           <form action="#" method="post">
            <fieldset>
                <legend>Tus Datos</legend>

                <label for="nombre">Nombre Completo</label>
                <input type="text" name="nombre" id="nombre" required minlength="3" title="Ingresa tu nombre completo (mínimo 3 caracteres).">

                <label for="documento">Numero de Documento</label>
                <input type="number" name="documento" id="documento" required minlength="6" maxlength="10" title="Ingresa tu número de documento.">

                <label for="correo">Correo Electrónico</label>
                <input type="email" name="correo" id="correo" required title="Ingresa una dirección de correo electrónico válida.">

                <label for="celular">Celular</label>
                <input type="tel" name="celular" id="celular" required pattern="3[0-9]" title="Ingresa tu número de celular.">
            </fieldset>
            
            <fieldset>
                <legend>Tu Alquiler</legend>

                <label for="fecha">Fecha de alquiler</label>
                <input type="date" name="fecha" id="fecha" required min="2026-11-01" max="2026-12-31" title="Selecciona la fecha de alquiler, entre el 1 de noviembre y el 31 de diciembre de 2026.">

                <label for="tipo_bicicleta">Tipo de bicicleta</label>
                <select name="tipo_bicicleta" id="tipo_bicicleta" required title="Selecciona el tipo de bicicleta que deseas alquilar.">
                    <option value="urbana">Urbana</option>
                    <option value="montaña">Montaña</option>
                    <option value="eléctrica">Eléctrica</option>
                </select>

                <label for="tipo_plan">Tipo de plan</label>
                <select name="tipo_plan" id="tipo_plan" required>
                    <option value="una_hora">Una hora</option>
                    <option value="medio_dia">Medio día</option>
                    <option value="dia_completo">Día completo</option>
                </select>

                <label for="cantidad_bicicletas">Cantidad de bicicletas</label>
                <input 
                type="number" name="cantidad_bicicletas" id="cantidad_bicicletas" 
                min="1" max="6" step="1" value="1"
                title="Indica cuántas bicicletas necesitas (de 1 a 6).">
                
                <label for="recorrido_guiado">Recorrido guiado</label>
                <select name="recorrido_guiado" id="recorrido_guiado" title="Selecciona un recorrido guiado si deseas participar en uno.">
                    <option value="rio_parques">Río y Parques</option>
                    <option value="sabores_barrio">Sabores de Barrio</option>
                    <option value="reto_palmas">Reto las palmas</option>
                    <option value="ninguno">Ninguno</option>
                </select>

                <label for="comentarios">Comentarios</label>
                <textarea name="comentarios" id="comentarios" maxlength="300">
                    Escribe cualquier comentario adicional (máximo 300 caracteres).
                </textarea>
            </fieldset>

            <fieldset>
                <legend>Confirmación</legend>

                <label for="confirmacion">Confirmación de las políticas de alquiler</label>
                <input type="checkbox" name="confirmacion" id="confirmacion" required>

                <button type="submit">Enviar formulario</button>
            </fieldset>

           </form>
        </section>

        <a href="mailto:hola@ruedalibre.example">Enviar correo a Rueda Libre</a>
        
    </main>
    <footer>
        <p>
            Rueda Libre
            hola@ruedalibre.example
            2026
        </p>
    </footer>
</body>

</html>
